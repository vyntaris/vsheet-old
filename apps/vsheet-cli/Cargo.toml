[package]
name = "vsheet-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "VSheet command line: inspect, convert, evaluate, script and serve MCP without a window"
publish = false

[lints]
workspace = true

[[bin]]
name = "vsheet-cli"
path = "src/main.rs"

[dependencies]
vsheet-sandbox = { workspace = true }
vsheet-engine = { workspace = true }
vsheet-mcp = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
# `check`: validating the packages VSheet writes (content types, relationships).
zip = { workspace = true }
quick-xml = { workspace = true }
